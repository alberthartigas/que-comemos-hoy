<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Sugerencias al azar de desayuno, comida y cena, con ingredientes por persona y video de TikTok.">
  <meta name="theme-color" content="#fff7ef">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="¿Qué comemos?">
  <title>¿Qué comemos hoy?</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // Tema: claro de fábrica; "oscuro" o "auto" si la persona lo eligió. Se aplica antes del CSS para que no parpadee.
    (function () { var t = 'claro'; try { t = localStorage.getItem('que-comemos-hoy:tema') || 'claro'; } catch (e) {} if (t !== 'auto') document.documentElement.dataset.tema = t === 'oscuro' ? 'oscuro' : 'claro'; })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="marca">
    <a class="marca__logo" href="#/semana" aria-label="Que Comemos, ir al inicio">
      <span class="marca__arbol" role="img" aria-hidden="true"></span>
      <span class="marca__letras" role="img" aria-hidden="true"></span>
      <span class="marca__texto">Que Comemos?</span>
    </a>
    <button id="tema" class="tema-boton" type="button" aria-label="Cambiar a modo oscuro"></button>
  </header>
  <main id="vista" class="vista" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Secciones">
    <a href="#/semana" data-pestana="semana"><span>Semana</span></a>
    <a href="#/hoy" data-pestana="hoy"><span>Hoy</span></a>
    <a href="#/compras" data-pestana="compras"><span>Compras</span></a>
    <a href="#/recetas" data-pestana="recetas"><span>Recetas</span></a>
    <a href="#/ajustes" data-pestana="ajustes"><span>Ajustes</span></a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>Esta app necesita JavaScript activado.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
