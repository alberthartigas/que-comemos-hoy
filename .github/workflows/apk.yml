# Compila la APK de Android y la publica como "release" de GitHub.
# Corre sola cuando cambia algo en android/ y también a mano (Actions → Run workflow).
# Enlace fijo a la última APK:
#   https://github.com/alberthartigas/que-comemos-hoy/releases/latest/download/que-comemos-hoy.apk
name: APK para Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    name: Compilar y publicar la APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Recuperar la llave de firma (secreto KEYSTORE_BASE64)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Falta el secreto KEYSTORE_BASE64 en el repositorio"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/firma.jks"

      - name: Compilar la APK firmada
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/firma.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Nombrar la APK
        run: cp android/app/build/outputs/apk/release/app-release.apk que-comemos-hoy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: que-comemos-hoy-apk
          path: que-comemos-hoy.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: ¿Qué comemos hoy? 0.1.${{ github.run_number }}
          body: |
            APK para Android (versión 0.1.${{ github.run_number }}).

            **Instalar:** descarga `que-comemos-hoy.apk` en el celular, ábrela y, si Android pregunta, permite instalar apps de este origen. La app abre https://laspinchisalitas.tech/proyectos/appcomidas/ a pantalla completa.
          files: que-comemos-hoy.apk

  probar:
    name: Probar la APK en un emulador
    needs: compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: que-comemos-hoy-apk

      - name: Habilitar KVM (acelera el emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar, abrir con y sin Chrome, y guardar capturas y registro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash android/probar-en-emulador.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico-emulador
          path: diagnostico/
